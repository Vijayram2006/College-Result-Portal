# Keeps the hosted KVELL result backend (Render free plan) awake. Render puts a free service to sleep after
# 15 minutes without requests, and waking it takes up to a minute; a health-check call every 10 minutes keeps it
# running. /healthz does not touch the database, so the Neon database can still pause when unused.
# GitHub may start scheduled runs a few minutes late; the 10-minute gap leaves room for that.
name: Keep hosted backend awake

on:
  schedule:
    - cron: "4-59/10 * * * *" # every 10 minutes, off the busy top of the hour
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the health check
        run: |
          curl --fail --silent --show-error --max-time 90 \
               --retry 5 --retry-delay 15 --retry-all-errors \
               https://kvell-result-api.onrender.com/healthz
