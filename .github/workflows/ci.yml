# Checks every push and pull request: backend tests against a real PostgreSQL, the security smoke test, the API
# contract, both frontend builds, dependency audits and licences. A red run must be fixed before deploying.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: result_portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/result_portal
      DB_USER: ci
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and integration tests (grading rules, two-step codes, CAPTCHA, cache, filters, migrations)
        working-directory: backend
        run: bash ./mvnw -B verify
      - name: Start the backend with demo accounts (CI-only passwords)
        working-directory: backend
        run: |
          for v in ADMIN HOD FACULTY NURSING_COE PHARMACY_COE SUPER_ADMIN; do
            echo "DEMO_${v}_PASSWORD=Ci$(openssl rand -hex 8)9" >> "$GITHUB_ENV"
          done
      - name: Run it
        working-directory: backend
        run: |
          SEED_DEMO_DATA=true API_DOCS_ENABLED=true SERVER_PORT=8080 \
            nohup java -jar target/result-portal-backend-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:8080/readyz
      - name: Security smoke test (roles, cross-student access, injection, headers)
        env:
          API: http://127.0.0.1:8080/api
        run: |
          ADMIN_PW="$DEMO_ADMIN_PASSWORD" HOD_PW="$DEMO_HOD_PASSWORD" FACULTY_PW="$DEMO_FACULTY_PASSWORD" \
            python3 backend/security-tests/rbac_smoke.py
      - name: API contract (docs/openapi.json must match the code; regenerate it when an endpoint changes)
        run: |
          curl -sf http://127.0.0.1:8080/v3/api-docs -o live.json
          python3 - <<'PY'
          import json, sys
          live = json.load(open("live.json")); saved = json.load(open("docs/openapi.json"))
          for d in (live, saved): d.pop("servers", None)
          if live != saved:
              lp, sp = set(live["paths"]), set(saved["paths"])
              print("Added endpoints:", sorted(lp - sp)); print("Removed endpoints:", sorted(sp - lp))
              sys.exit("docs/openapi.json is out of date: the API changed. Regenerate it (see docs/API.md).")
          print("API contract unchanged:", len(live["paths"]), "endpoints")
          PY
      - name: Backend log (on failure)
        if: failure()
        run: tail -200 backend/backend.log || true

  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (production, high and critical)
        run: pnpm audit --prod --audit-level high
      - name: Build
        run: pnpm exec vite build
        env:
          VITE_API_BASE_URL: https://kvell-result-api.onrender.com/api
      - name: No source maps or secrets in the bundle
        run: |
          ! ls dist/public/assets/*.map 2>/dev/null
          ! grep -rEl "DB_PASSWORD|RENDER_API_KEY|BEGIN (RSA )?PRIVATE KEY" dist/public
      - name: Licences (no copyleft in production dependencies)
        run: npx -y license-checker-rseidelsohn@4.4.2 --production --summary --failOn "GPL-2.0;GPL-3.0;AGPL-3.0;LGPL-3.0"

  coe-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      - name: Dependency audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Type check and build
        run: npm run build
        env:
          VITE_API_URL: https://kvell-result-api.onrender.com/api
      - name: No source maps or secrets in the bundle
        run: |
          ! ls dist/assets/*.map 2>/dev/null
          ! grep -rEl "DB_PASSWORD|RENDER_API_KEY|BEGIN (RSA )?PRIVATE KEY" dist
      - name: Licences (no copyleft in production dependencies)
        run: npx -y license-checker-rseidelsohn@4.4.2 --production --summary --failOn "GPL-2.0;GPL-3.0;AGPL-3.0;LGPL-3.0"
