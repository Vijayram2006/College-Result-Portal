spring.application.name=result-portal-backend

# Database: values come from the environment (see start-demo.ps1 / .env)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/result_portal}
spring.datasource.username=${DB_USER:result_portal}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
# Small pool: hosted free databases (Neon) allow few connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Hosting platforms (Render) say which port to listen on in PORT
server.port=${PORT:8080}

# Never leak stack traces or exception messages to clients
server.error.include-stacktrace=never
server.error.include-message=never

# Session tokens
app.auth.token-hours=8
app.auth.max-failed-logins=5
app.auth.lockout-minutes=15

# Client IP for the login lockout and audit log. Leave "none" when browsers reach the backend directly. Behind a
# reverse proxy or load balancer set FORWARD_HEADERS_STRATEGY=native: Tomcat then reads X-Forwarded-For, trusting it
# only from private-network proxies, so one shared proxy address cannot lock everybody out.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Comma-separated browser origins allowed to call the API (dev servers)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002}

# Demo data: only inserted when the database has no users yet
app.seed.enabled=${SEED_DEMO_DATA:false}
app.seed.admin-password=${DEMO_ADMIN_PASSWORD:}
app.seed.hod-password=${DEMO_HOD_PASSWORD:}
app.seed.faculty-password=${DEMO_FACULTY_PASSWORD:}
app.seed.nursing-coe-password=${DEMO_NURSING_COE_PASSWORD:}
app.seed.pharmacy-coe-password=${DEMO_PHARMACY_COE_PASSWORD:}
app.seed.super-admin-password=${DEMO_SUPER_ADMIN_PASSWORD:}
# Answer script PDFs (one scanned script per upload)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Session limits: COE / Chief COE sessions end after 30 idle minutes, others after 2 hours (all after token-hours)
app.auth.admin-idle-minutes=${ADMIN_IDLE_MINUTES:30}
app.auth.idle-minutes=${IDLE_MINUTES:120}
# Two-step sign-in (authenticator app) is required for every COE and Chief COE account
app.auth.mfa-required=${MFA_REQUIRED:true}

# The visitor's real address when the backend sits behind a CDN/proxy that sets it (Render: CF-Connecting-IP).
# Leave empty when browsers reach the backend directly.
app.client-ip-header=${CLIENT_IP_HEADER:}

# Requests per visitor address per minute (sign-in and public pages / signed-in calls)
app.rate-limit.public-per-minute=${RATE_LIMIT_PUBLIC:120}
app.rate-limit.signed-in-per-minute=${RATE_LIMIT_SIGNED_IN:600}

# Retention (docs/RETENTION-POLICY.md)
app.retention.audit-years=${AUDIT_RETENTION_YEARS:7}
app.retention.notification-days=${NOTIFICATION_RETENTION_DAYS:365}

# Finish requests in flight before stopping (deploys and restarts), compress JSON responses
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/csv
server.compression.min-response-size=2KB
# Slow clients and stuck requests
server.tomcat.connection-timeout=20s
spring.mvc.async.request-timeout=60s
spring.transaction.default-timeout=60s

# Logs: JSON lines (one per event, with the request id) when LOG_FORMAT=ecs; plain text otherwise
logging.structured.format.console=${LOG_FORMAT:}
logging.pattern.level=%5p [%X{requestId:-}]

# OpenAPI description: /v3/api-docs (off in production unless API_DOCS_ENABLED=true)
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.packages-to-scan=edu.kvell.results
